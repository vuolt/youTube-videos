<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:300;src:url(fonts/Poppins-Light.ttf)}
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/Poppins-Regular.ttf)}
@font-face{font-family:Poppins;font-weight:500 600;src:url(fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:700 900;src:url(fonts/Poppins-Bold.ttf)}
@font-face{font-family:DejaVuMono;font-weight:100 900;src:url(fonts/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script><script src="scenes.js"></script>
<script>
window.ready = (async () => {
  for (const w of [300,400,500,700]) await document.fonts.load(`${w} 40px Poppins`);
  await document.fonts.load('700 40px DejaVuMono');
  return true;
})();
</script></body></html>
